name: Compilar librespot para Linux

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'librespot'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar librespot desde repo oficial con Cargo.lock fijo
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/librespot-org/librespot.git /tmp/librespot-src
          cd /tmp/librespot-src
          cargo update -p vergen --precise 9.0.6 || true
          cargo build --release --no-default-features --features "native-tls"
          cp /tmp/librespot-src/target/release/librespot $GITHUB_WORKSPACE/librespot
          strip $GITHUB_WORKSPACE/librespot

      - name: Guardar binario en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add librespot
          git diff --staged --quiet || (git commit -m "Agregar binario librespot Linux" && git push)

name: Compilar librespot para Linux

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'librespot'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar librespot con dependencias bloqueadas (--locked)
        run: |
          cargo install librespot --locked --no-default-features --features "native-tls"
          cp ~/.cargo/bin/librespot ./librespot
          strip ./librespot

      - name: Guardar binario en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add librespot
          git diff --staged --quiet || (git commit -m "Agregar binario librespot Linux" && git push)